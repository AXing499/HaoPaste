name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PROJECT_VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' project.yml | head -n1)
          if [[ -z "$PROJECT_VERSION" || "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag ${TAG} does not match project.yml MARKETING_VERSION (${PROJECT_VERSION:-missing})" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild \
            -project HaoPaste.xcodeproj \
            -scheme HaoPaste \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci \
            test -quiet

      - name: Build Release app
        run: |
          xcodebuild \
            -project HaoPaste.xcodeproj \
            -scheme HaoPaste \
            -configuration Release \
            -derivedDataPath .build/release \
            build -quiet

      - name: Build DMG
        env:
          HAOPASTE_DMG_LAYOUT: "0"
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          APP=".build/release/Build/Products/Release/HaoPaste.app"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          if [[ "$APP_VERSION" != "$VERSION" ]]; then
            echo "Built app version ${APP_VERSION} does not match tag ${VERSION}" >&2
            exit 1
          fi
          Scripts/package-dmg.sh "$APP"
          test -f "dist/HaoPaste-${VERSION}.dmg"
          test -f "dist/HaoPaste-${VERSION}.dmg.sha256"

      - name: Read changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.raw.md"
          if [[ ! -s "$RUNNER_TEMP/changelog.raw.md" ]]; then
            echo "No CHANGELOG.md entry for ${VERSION}; add one before tagging." >&2
            exit 1
          fi
          sed '1d' "$RUNNER_TEMP/changelog.raw.md" > "$RUNNER_TEMP/changelog.md"

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          HaoPaste ${VERSION}

          ## 安装 / Installation

          ### 中文
          1. 下载 \`HaoPaste-${VERSION}.dmg\`
          2. 打开 DMG，将 HaoPaste 拖入 Applications / 应用程序
          3. 首次打开如提示「无法验证开发者」：打开「系统设置 → 隐私与安全性」，在「安全性」中找到 HaoPaste，点击「仍要打开」；也可以在 Finder 中右键 HaoPaste → 打开。

          系统要求：macOS 14 或更高版本。SHA-256 校验文件已一并上传。

          ### English
          1. Download \`HaoPaste-${VERSION}.dmg\`
          2. Open the DMG and drag HaoPaste into Applications.
          3. If macOS says the developer cannot be verified: open System Settings → Privacy & Security → Security, find HaoPaste and click "Open Anyway". You can also right-click HaoPaste in Finder and choose Open.

          Requires macOS 14 or later. A SHA-256 checksum is attached.

          ## 本次变更 / Changes
          EOF
          cat "$RUNNER_TEMP/changelog.md" >> "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/HaoPaste-${VERSION}.dmg"
          SHA="${DMG}.sha256"
          TITLE="HaoPaste ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
            gh release upload "$TAG" "$DMG" "$SHA" --clobber
          else
            gh release create "$TAG" "$DMG" "$SHA" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

          gh release view "$TAG" --json url,name,tagName,assets
